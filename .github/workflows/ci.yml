name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: РЎРєР°С‡РёРІР°РµРј РєРѕРґ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ
        uses: actions/checkout@v4

      - name: РЈСЃС‚Р°РЅР°РІР»РёРІР°РµРј Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: РЈСЃС‚Р°РЅР°РІР»РёРІР°РµРј Poetry
        run: pip install poetry

      - name: РЈСЃС‚Р°РЅР°РІР»РёРІР°РµРј Р·Р°РІРёСЃРёРјРѕСЃС‚Рё РїСЂРѕРµРєС‚Р°
  
        run: poetry install --no-interaction --no-root

      - name: РџРѕРґРіРѕС‚РѕРІРєР° Рє СЃР±РѕСЂРєРµ Docker-РѕР±СЂР°Р·Р°
        id: prep
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Р›РѕРіРёРЅРёРјСЃСЏ РІ GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: РЎРѕР±РёСЂР°РµРј Рё РїСѓС€РёРј Docker-РѕР±СЂР°Р· РІ GCR
        uses: docker/build-push-action@v5
        with:
            context: .
            push: ${{ github.event_name != 'pull_request' }}
            tags: |
              ${{ steps.prep.outputs.image_id }}:latest
              ${{ steps.prep.outputs.image_id }}:sha-${{ github.sha }}

